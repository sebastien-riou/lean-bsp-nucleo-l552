[bsp]
name = "nucleo-l552"
lean_bsp_contract_version = "1.5"
version = "0.1.0"
description = "ST NUCLEO-L552ZE-Q board (STM32L552ZE, Cortex-M33)"
maintainer = "sebastien.riou@pqshield.com"
entry_point = "bsp_cli.py"

[bsp.hardware]
flash_bytes = 0x40000                # bank 1; bank 2 is NVM region 0
ram_bytes = 0x40000                  # SRAM1 192 KiB + SRAM2 64 KiB

[bsp.mcu]                            # contract 1.5: what the application runs on
vendor = "ST"
part = "STM32L552ZET6Q"              # the ordering code, from the STM32CubeMX project (nucleo-l552.ioc)
families = ["STM32", "STM32L5", "STM32L552"]
checked = false                      # declared only
reserved = ["RCC", "PWR", "FLASH", "ICACHE", "SysTick", "DWT", "USART3", "LPUART1", "ADC1", "RTC", "UCPD1", "USB", "PC7", "PB7", "PA9", "PC13"]

[bsp.build]
backend = "custom"                   # bsp_cli.py drives the compiler; CROSS_COMPILE selects it
requires_tools = ["arm-none-eabi-gcc", "hwbridge"]

[bsp.primitives]
uart = true                          # UART 0 is USART3, the ST-LINK virtual COM port on this board (README)
led = true                           # 0 green (LD1), 1 blue (LD2), 2 red (LD3)
button = true                        # 0 is the blue user button
cpu_cycle_counter = true             # DWT CYCCNT
cpu_frequency = true
cache_clear = true                   # the instruction cache
heap_usage = true                    # src/bsp_heap.c, lean-bsp's heap counter
flash_read = true                    # NVM region 0, flash bank 2
flash_erase = true
flash_write = true

[[bsp.nvm_regions]]
name = "bank2"                       # never loaded: the image stays in bank 1
base = 0x08040000
size = 0x40000
page_size = 2048                     # dual-bank mode (DBANK=1)
write_size = 8                       # a double-word, the ECC word
zero_overwrite = true

[[bsp.targets]]
name = "cortex-m33"
cpu = "cortex-m33"
toolchain = "arm-none-eabi"
cflags = ["-mcpu=cortex-m33", "-mthumb", "-mfpu=fpv5-sp-d16", "-mfloat-abi=softfp"]
linker_fragments = ["memory.ld", "sections_head.ld", "sections_data.ld", "sections_tail.ld"]
run_mode = "auto-after-load"
trustzone = "off"                    # TZEN=0: the image runs from the non-secure flash alias
